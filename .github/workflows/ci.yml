# 每個 PR、以及合併（push）到 main 時自動執行：翻譯檢查、單元測試、打包。
# macOS 和 Windows 兩個 job 同時跑：macOS 打包 App 和 DMG，Windows 打包安裝程式。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一個 PR 推了新的 commit，就取消還在跑的舊檢查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build script 用 git 歷史計算版本號

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Check localizations
        run: ./scripts/check-localizations.sh

      - name: Run tests
        run: swift test

      - name: Build app
        # CI 沒有簽章憑證，會用臨時簽章；這裡只確認打包流程沒壞
        run: ./scripts/build-app.sh

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict build/Tatami.app
          test -d build/Tatami.app/Contents/Frameworks/Sparkle.framework
          test -f build/Tatami.app/Contents/Resources/AppIcon.icns
          test -f build/Tatami.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          plutil -lint build/Tatami.app/Contents/Info.plist

      - name: Build DMG
        run: ./scripts/make-dmg.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build script 用 git describe 計算版本號

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Windows/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check localizations
        run: python scripts/check_localizations.py

      - name: Run tests
        run: dotnet test Windows/Tatami.sln -c Release

      - name: Install Inno Setup
        # runner 映像檔通常已經有 Inno Setup 6，沒有才用 Chocolatey 安裝
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        # 沒有程式碼簽章，安裝程式未簽署；這裡只確認打包流程沒壞
        run: pwsh scripts/build-windows.ps1

      - name: Verify installer
        run: |
          if (-not (Test-Path build/windows/publish/Tatami.exe)) {
            Write-Output '::error::build/windows/publish/Tatami.exe is missing'
            exit 1
          }
          $installer = @(Get-ChildItem build/windows/Tatami-*-Setup.exe)
          if ($installer.Count -ne 1) {
            Write-Output '::error::Expected one build/windows/Tatami-*-Setup.exe'
            exit 1
          }
          Write-Output "$($installer[0].Name) ($($installer[0].Length) bytes)"

      # 上傳安裝程式，不用發 release 也能下載這個 PR 的版本試用
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Tatami-windows-installer
          path: build/windows/Tatami-*-Setup.exe
          if-no-files-found: error
