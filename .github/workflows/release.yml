# 發佈 GitHub Release 時自動編譯 macOS 和 Windows 版，版本號使用 release 的 tag，全部上傳到該 release：
#   macos    用固定憑證簽署 Tatami.app、打包成 DMG，產生 Sparkle 的 appcast.xml
#   windows  打包 Inno Setup 安裝程式，產生 NetSparkle 的 appcast-windows.xml 和它的簽章檔
#
# 兩個 job 互相獨立：一個平台失敗時，另一個平台照樣上傳。好處是 macOS 的更新不會被 Windows 的問題擋住
# （反之亦然）；代價是 release 可能只有其中一個平台的檔案，要修好失敗的平台後重新發佈（見 AGENTS.md）。
#
# 使用方式：在 GitHub 建立 release，tag 取名為 v1.2.3 或 1.2.3，按下 Publish release。
#
# 需要的 repository secrets（Settings → Secrets and variables → Actions）：
#   TATAMI_CERT_P12         "Tatami Dev" 憑證匯出的 .p12，經過 base64 編碼
#   TATAMI_CERT_PASSWORD    匯出 .p12 時設定的密碼
#   SPARKLE_PRIVATE_KEY     generate_keys -x 匯出的 Sparkle 私鑰（macOS）
#   NETSPARKLE_PRIVATE_KEY  netsparkle-generate-appcast --export 匯出的私鑰（Windows）
#   NETSPARKLE_PUBLIC_KEY   同上匯出的公鑰，用來確認私鑰和 App 裡的公鑰是同一組
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # 上傳 release 附件需要

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 取得完整歷史，build script 用 commit 數量當 build number（Sparkle 靠它判斷新舊）

      - name: Resolve version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          # 只接受 1.2.3 或 1.2.3-beta.1 這類格式，避免奇怪的 tag 寫進 Info.plist
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.TATAMI_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TATAMI_CERT_PASSWORD }}
        run: |
          # 固定簽章：每個版本都用同一個憑證，使用者更新後輔助使用權限才會保留
          if [ -z "$CERT_P12" ]; then
            echo "::error::Secret TATAMI_CERT_P12 is missing"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Check localizations
        run: ./scripts/check-localizations.sh

      - name: Run tests
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Verify signature
        run: |
          # 確認真的用了 Tatami Dev 憑證，而不是退回臨時簽章
          codesign --verify --deep --strict build/Tatami.app
          codesign -dvv build/Tatami.app 2>&1 | grep -q "Authority=Tatami Dev" \
            || { echo "::error::App is not signed with Tatami Dev"; exit 1; }

      - name: Package DMG
        run: |
          ./scripts/make-dmg.sh "Tatami-$VERSION.dmg"
          shasum -a 256 "Tatami-$VERSION.dmg" | tee "Tatami-$VERSION.dmg.sha256"

      - name: Write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ./scripts/make-appcast.sh \
            "Tatami-$VERSION.dmg" \
            "$REPO_URL/releases/download/$TAG/Tatami-$VERSION.dmg" \
            "$REPO_URL/releases/tag/$TAG" \
            appcast.xml
          cat appcast.xml

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "Tatami-$VERSION.dmg" "Tatami-$VERSION.dmg.sha256" appcast.xml \
            --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 和 macOS 一樣取得完整歷史

      - name: Resolve version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:TAG -creplace '^v', ''
          # 只接受 1.2.3 或 1.2.3-beta.1 這類格式（和 macOS job 相同的規則）
          if ($version -cnotmatch '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$') {
            Write-Output "::error::Release tag '$env:TAG' is not a version like v1.2.3"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "TAG=$env:TAG"

      - name: Check update signing keys
        env:
          NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
          NETSPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
        run: |
          # 沒有金鑰就無法簽署更新，App 會拒絕這個版本，先失敗比較好
          foreach ($name in 'NETSPARKLE_PRIVATE_KEY', 'NETSPARKLE_PUBLIC_KEY') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              Write-Output "::error::Secret $name is missing"
              exit 1
            }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Windows/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check localizations
        run: python scripts/check_localizations.py

      - name: Run tests
        run: dotnet test Windows/Tatami.sln -c Release

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        # VERSION 已經在上面寫進 GITHUB_ENV，build script 會用它
        run: pwsh scripts/build-windows.ps1

      - name: Write checksum
        run: |
          $name = "Tatami-$env:VERSION-Setup.exe"
          $path = "build/windows/$name"
          if (-not (Test-Path $path)) {
            Write-Output "::error::$path is missing"
            exit 1
          }
          # 和 shasum -a 256 相同的格式：「<小寫 hash>  <檔名>」
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$((Resolve-Path $path).Path).sha256", "$hash  $name`n")
          Get-Content "$path.sha256"

      - name: Write appcast
        env:
          # netsparkle-generate-appcast 讀的是 SPARKLE_* 這兩個名稱
          SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $name = "Tatami-$env:VERSION-Setup.exe"
          pwsh scripts/make-appcast-windows.ps1 `
            "build/windows/$name" `
            "$env:REPO_URL/releases/download/$env:TAG/$name" `
            "$env:REPO_URL/releases/tag/$env:TAG" `
            appcast-windows.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content appcast-windows.xml

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Tatami-$env:VERSION-Setup.exe"
          gh release upload "$env:TAG" `
            "build/windows/$name" "build/windows/$name.sha256" `
            appcast-windows.xml appcast-windows.xml.signature `
            --clobber
